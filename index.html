<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./tailStyle.css" rel="stylesheet" />
  <title>Todo app</title>
</head>
<body class="bg-white m-0 flex flex-col md:grid md:grid-cols-[20vw_1fr] md:grid-rows-[50px_1fr] h-screen font-display">
  <!-- Header -->
  <header class="h-[70px] flex items-center justify-between p-7 md:col-span-2">
    <h2 class="mr-auto text-3xl relative left-3.5 select-none" id="appName">todo</h2>
    <!-- Progress Bar -->

    <button class="cursor-pointer ml-auto w-[40px] h-[40px] rounded-full border-0 text-3xl flex items-center justify-center align-middle hover:bg-amber-100" id="addNew" aria-label="Add new task">
      <svg class="w-6 h-6 text-gray-800 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/>
</svg>

    </button>
  </header>

  <!-- Sidebar -->
  <aside class="w-full md:w-[20vw] flex flex-col md:justify-between pt-3 px-4 md:row-span-1 md:h-auto overflow-y-auto max-h-[calc(100vh-50px)] scrollbar-none">

    <!-- Filters (mobile view: horizontal scroll) -->
    <div class="flex gap-2 overflow-x-auto md:flex-col md:overflow-visible whitespace-nowrap scrollbar-none p-2 md:p-0" id="tag-filters">
      
    </div>
    <div>
    <div class="w-[75%] mt-0 mb-2 justify-self-center">
  <div class="flex justify-between mb-1">
    <span class="text-sm font-medium text-gray-700">Progress</span>
    <span id="progressText" class="text-sm font-medium text-gray-700">0%</span>
  </div>
  <div class="w-full bg-gray-200 rounded-full h-3">
    <div id="progressBar" class="bg-[#DAF2D2] h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
  </div>
</div>
    <!-- Status filters pinned at bottom (in desktop view) -->
    <div class="p-2 md:p-0 mt-4 md:mt-0 md:mb-5 md:pt-5 flex gap-2 overflow-x-auto md:flex-col md:overflow-visible whitespace-nowrap scrollbar-none justify-center md:justify-start" id="status-filter">
      
      <button class="cursor-pointer shrink-0 py-2 px-3 flex items-center gap-2 border-0 hover:bg-gray-200 rounded-2xl" data-status="all">
        <div class="bg-[#D2CEFF] w-[25px] h-[25px] rounded-full shrink-0"></div>
        <span class="text-[15px]">All</span>
        <span class="text-[12px] text-gray-500" id="all-count">0</span>
      </button>
      <button class="cursor-pointer shrink-0 py-2 px-3 flex items-center gap-2 border-0 hover:bg-gray-200 rounded-2xl" data-status="done">
        <div class="bg-[#DAF2D2] w-[25px] h-[25px] rounded-full shrink-0"></div>
        <span class="text-[15px]">Done</span>
        <span class="text-[12px] text-gray-500" id="done-count">0</span>
      </button>
      <button class="cursor-pointer shrink-0 py-2 px-3 flex items-center gap-2 border-0 hover:bg-gray-200 rounded-2xl" data-status="on going">
        <div class="bg-[#FFCECE] w-[25px] h-[25px] rounded-full shrink-0"></div>
        <span class="text-[15px]">On going</span>
        <span class="text-[12px] text-gray-500" id="ongoing-count">0</span>
      </button>
    </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-4 md:row-start-2 md:col-start-2 overflow-auto pt-5">
    <div class="columns-1 md:columns-2 gap-3 space-y-3 p-5" id="tasksContainer">
      <!-- Task Card -->
      
    </div>
  </main>

  <!-- Modal -->
  <div id="addModal" class="hidden fixed z-10 left-0 top-0 w-full h-full overflow-auto bg-[rgba(0,0,0,0.4)] flex justify-center items-center">
    <div class="w-full h-full md:w-[60%] md:h-auto bg-white p-6 md:p-10 border-1 border-[#888] border-solid rounded-none md:rounded-xl overflow-y-auto">
      <form id="NewTaskForm">
        <div class="pt-3 pb-8 flex justify-between">
          <button type="button" id="cancelBtn" class="border-0 cursor-pointer text-[#69665C]">Cancel</button>
          <input type="submit" value="Add" class="bg-[#69665C] text-white px-4 py-2 rounded-2xl w-[150px] cursor-pointer" />
        </div>

        <div class="pt-2">
          <label for="taskTitle">Task title</label><br />
          <input type="text" name="title" id="taskTitle" placeholder="Enter" class="bg-[#f9f9f7] px-2 py-1.5 rounded-[12px] placeholder:pr-3 w-[95%]" required /><br /><br />
          <label for="description">Description</label><br />
          <textarea name="description" id="description" cols="40" rows="3" placeholder="Task description" class="bg-[#f9f9f7] px-2 py-1.5 rounded-[12px] placeholder:pr-3 w-[95%] resize-none"></textarea>
        </div>

        <h3 class="mt-6 mb-2 font-medium">Tags</h3>
        <div id="modalTags" class="flex flex-wrap gap-3 mb-4">
          <p>No tags for now</p>
          <button type="button" id="showAddtag" class="cursor-pointer flex items-center justify-center gap-1 bg-[#69665C] text-white ml-3 px-3 py-2 rounded-full hover:bg-[#5e5b52] w-[25px] h-[25px]">
            <span class="text-lg">+</span>
          </button>
        </div>

        <div class="flex flex-wrap items-center  gap-3 mb-4 hidden" id="addNewtagForm">
          <input type="text" id="newTagName" placeholder="Tag name" class="px-3 py-2 rounded-xl bg-gray-100" />
          <input type="color" id="newTagColor" value="#DAF2D6" class="w-10 h-10 p-1 rounded-full border border-gray-300 cursor-pointer" />
          <button type="button" id="addTagBtn" class="flex items-center justify-center gap-1 bg-blue-600 text-white ml-3 px-3 py-2 rounded-xl hover:bg-blue-700">
            <span class="text-xs">
              <svg class="w-2 h-2 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/>
</svg>

            </span> Add Tag
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JS Logic -->
  <script src="./src/script.js">
  </script>
</body>
</html>
